# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "dev","uat","prod" ]
  pull_request:
    branches: [ "dev","uat","prod" ]

jobs:
  buildAndDeploy:

    runs-on: ubuntu-latest
    environment: ${{github.event.pull_request.base.ref || github.ref_name}}

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Validate Environment Variable
      run: |
        if [ -z "${{ vars.MULE_ENV }}" ];then
          echo "---MULE ENV VARIABLE IS NOT SET---"
          exit 1
        fi
        echo "---Deploying to ${{vars.MULE_ENV}} environment.---"
      
        run: mvn clean package --file pom.xml --settings .maven/settings.xml
    - name: Build application
      run: mvn clean package --file pom.xml --settings .maven/settings.xml

    - name: Publish to Anypoint Exchange
      if: github.event_name == 'push' && github.ref_name == 'dev'
      run: mvn deploy -DskipMuleDeploy -Dclient_id=${{ vars.MULE_CLIENT_ID }} -Dclient_secret=${{ secrets.MULE_CLIENT_SECRET }} --file pom.xml --settings .maven/settings.xml


    - name: Deploy to CloudHub
      if: github.event_name == 'push'
      run: mvn deploy -DmuleDeploy -Dmule.env=${{ vars.MULE_ENV }} -Dclient_id=${{ vars.MULE_CLIENT_ID }} -Dclient_secret=${{ secrets.MULE_CLIENT_SECRET }} -Dmule.instance=${{vars.MULE_INSTANCE}} --file pom.xml --settings .maven/settings.xml

    - name: Deployment Summary
      if: success()
      run: echo "--- Deployment successful to ${{ vars.MULE_ENV }} environment ---"

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
